<title>憋不住了！Poop!</title>
<!--
  Custom Web shell for BRAKE! (Godot "Web" export preset -> html/custom_html_shell).
  EDIT THIS FILE (web/shell.template.html), then run `python tools/web/gen_shell.py`, which writes
  web/shell.html with the logo embedded. tools/web/build_web.sh does that automatically.

  Boot flow (docs/web.md, "How the shell works"; research: docs/web_perf_research.md §3.1/§3.5):
    1. download engine + pack  ||  precompile every WebGL program of the game in a hidden context
       (shaders.json.gz, captured at build time by tools/web/capture_shaders.py) so the engine's own
       links later hit Chrome's GPU program cache. Gives up waiting 20 s after the download.
    2. engine.start() BEFORE the tap; the overlay stays on top. Godot reports its stages through
       window.brakeBoot.stage(id, fraction, label) and calls window.brakeBoot.ready() once its warm-up
       is done and the title runs smoothly behind the overlay (fallback: 120 s after engine start).
    3. "点击开始" (a real DOM gesture): iOS motion permission, resume every AudioContext (the engine
       created its context before any gesture, so it starts suspended), fullscreen + landscape on
       phones, brakeBoot.tapped = true, fade the overlay out (opacity/transform only).
  ?autoplay=1 / ?autostart=1 need no tap: the overlay fades once the game is ready (audio then starts
  on the first tap in game). Debug: ?noprecompile=1, ?noscissorfix=1.
-->
<style>
:root {
	--ink: #0b0e12;
	--amber: #ffb020;
	--amber-deep: #ff8a1e;
	--red: #ff3b30;
	--text: rgba(255, 255, 255, 0.92);
	--muted: rgba(255, 255, 255, 0.52);
	--faint: rgba(255, 255, 255, 0.34);
	--font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--ink);
	color: var(--text);
	font-family: var(--font);
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	outline: none;
	background: var(--ink);
	touch-action: none;
}
#canvas:focus { outline: none; }

/* ---------------------------------------------------------------- loading / start screen
   The engine runs (and may block the main thread for seconds) while this overlay is up, so every
   animation here is transform / opacity only: those keep running on the compositor thread. */
#boot {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: clamp(14px, 4.2vh, 34px);
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	box-sizing: border-box;
	background:
		radial-gradient(120% 70% at 50% 118%, rgba(255, 146, 40, 0.20) 0%, rgba(255, 146, 40, 0.06) 38%, rgba(0, 0, 0, 0) 64%),
		radial-gradient(90% 60% at 50% -12%, rgba(120, 150, 190, 0.10) 0%, rgba(0, 0, 0, 0) 60%),
		var(--ink);
	will-change: opacity, transform;
	transition: opacity 0.3s ease, transform 0.3s ease;
}
#boot.leaving { opacity: 0; transform: scale(1.015); pointer-events: none; }
/* short screens (landscape phones): the boot column may not fit -> let it scroll, still centred when it fits */
#boot {
	justify-content: flex-start;
	overflow-x: hidden;
	overflow-y: auto;
	-webkit-overflow-scrolling: touch;
	overscroll-behavior: contain;
	touch-action: pan-y;
}
#boot > #logo { margin-top: auto; flex-shrink: 0; }
#boot > #panel { margin-bottom: auto; flex-shrink: 0; padding-bottom: 18px; }
#boot::after {   /* a faint horizon line: road at dusk */
	content: "";
	position: absolute;
	left: 8%;
	right: 8%;
	bottom: 21%;
	height: 1px;
	background: linear-gradient(90deg, rgba(255, 176, 32, 0), rgba(255, 176, 32, 0.28), rgba(255, 176, 32, 0));
	pointer-events: none;
}
#logo {
	width: min(640px, 74vw);
	max-height: 36vh;
	object-fit: contain;
	filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.55));
	animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }

#panel {
	position: relative;
	z-index: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	min-height: 120px;
}

/* The start button doubles as the progress bar: a disabled pill that fills while loading and turns
   into the amber "点击开始" button once the game is ready. */
#start-wrap { position: relative; }
#start-wrap::before {   /* pulse ring (ready only) */
	content: "";
	position: absolute;
	inset: -2px;
	border-radius: 32px;
	border: 2px solid rgba(255, 176, 32, 0.55);
	opacity: 0;
	pointer-events: none;
}
#boot.ready #start-wrap::before { animation: ring 2.2s ease-out infinite; }
@keyframes ring { 0% { opacity: 0.75; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.16, 1.32); } }
#start {
	position: relative;
	overflow: hidden;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	min-width: min(300px, 72vw);
	height: 56px;
	padding: 0 40px;
	margin: 0;
	border: 0;
	border-radius: 28px;
	appearance: none;
	-webkit-appearance: none;
	background: rgba(255, 255, 255, 0.06);
	box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10);
	color: var(--text);
	font-family: var(--font);
	font-size: 17px;
	font-weight: 700;
	letter-spacing: 0.14em;
	text-indent: 0.14em;
	font-variant-numeric: tabular-nums;
	cursor: default;
	touch-action: manipulation;
	transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
}
#start-fill {
	position: absolute;
	inset: 0;
	transform-origin: 0 50%;
	transform: scaleX(0);
	background: linear-gradient(90deg, rgba(255, 138, 30, 0.50), rgba(255, 176, 32, 0.72));
	transition: transform 0.4s ease;
	will-change: transform;
}
#start-sheen {   /* "still working" sweep while the main thread may be blocked */
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 38%;
	background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
	transform: translateX(-110%);
	animation: sweep 1.6s ease-in-out infinite;
	will-change: transform;
	pointer-events: none;
}
@keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
#start-label { position: relative; z-index: 1; white-space: nowrap; }
#boot.ready #start {
	background: linear-gradient(180deg, #ffc040, var(--amber) 55%, #f59a0c);
	box-shadow: 0 8px 26px rgba(255, 160, 32, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.45);
	color: var(--ink);
	font-size: 21px;
	font-weight: 800;
	letter-spacing: 0.18em;
	text-indent: 0.18em;
	cursor: pointer;
}
#boot.ready #start-fill, #boot.ready #start-sheen { display: none; }
#boot.ready #start:hover { filter: brightness(1.06); }
#boot.ready #start:active { transform: scale(0.97); }
#start:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.7); outline-offset: 4px; }

#status {
	font-size: 13px;
	letter-spacing: 0.08em;
	color: var(--muted);
	font-variant-numeric: tabular-nums;
	min-height: 18px;
	text-align: center;
}
#boot.ready #status { color: rgba(255, 255, 255, 0.70); }
#hint {
	font-size: 13px;
	color: var(--muted);
	letter-spacing: 0.06em;
	text-align: center;
	line-height: 1.6;
	padding: 0 16px;
}
#hint b { color: rgba(255, 255, 255, 0.82); font-weight: 600; }
#firstvisit {
	display: none;
	font-size: 12px;
	color: var(--faint);
	letter-spacing: 0.06em;
	text-align: center;
	padding: 0 16px;
}
#boot.firstvisit #firstvisit { display: block; }
#boot.ready #firstvisit { display: none; }

#notice {
	display: none;
	max-width: min(560px, 86vw);
	padding: 14px 18px;
	border-radius: 12px;
	background: rgba(255, 59, 48, 0.12);
	border: 1px solid rgba(255, 59, 48, 0.55);
	color: #ffd9d6;
	font-size: 14px;
	line-height: 1.55;
	text-align: center;
	white-space: pre-line;
	-webkit-user-select: text;
	user-select: text;
}
#boot.failed #start-wrap, #boot.failed #status, #boot.failed #hint, #boot.failed #firstvisit { display: none; }
#boot.failed #notice { display: block; }
#pcskip {
	display: none;
	margin: 2px auto 0;
	padding: 6px 12px;
	border: 1px solid rgba(255, 255, 255, 0.16);
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.04);
	color: var(--muted);
	font: inherit;
	font-size: 12px;
	letter-spacing: 0.06em;
	cursor: pointer;
}
#pcskip:active { background: rgba(255, 255, 255, 0.10); }
#reload {
	display: none;
	margin: 4px auto 0;
	padding: 10px 28px;
	border: 0;
	border-radius: 999px;
	background: #ffb020;
	color: #111;
	font: inherit;
	font-size: 16px;
	font-weight: 700;
	letter-spacing: 0.12em;
	cursor: pointer;
}
#boot.failed #reload { display: inline-block; }
#iostip {
	display: none;
	max-width: min(520px, 86vw);
	margin: 2px auto 0;
	padding: 7px 14px;
	border-radius: 10px;
	background: rgba(255, 176, 32, 0.10);
	border: 1px solid rgba(255, 176, 32, 0.35);
	color: rgba(255, 255, 255, 0.78);
	font-size: 12px;
	line-height: 1.55;
	letter-spacing: 0.04em;
	text-align: center;
}
#boot.ios #iostip { display: block; }
#boot.failed #iostip { display: none; }
#boot.ready #pcskip, #boot.failed #pcskip { display: none !important; }

@media (prefers-reduced-motion: reduce) {
	#start-sheen { animation: none; opacity: 0; }
	#boot.ready #start-wrap::before { animation: none; }
}

/* ---------------------------------------------------------------- rotate-device hint (phones, portrait) */
#rotate {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 22px;
	background: var(--ink);
	color: var(--text);
	text-align: center;
}
#rotate svg { width: 92px; height: 92px; animation: turn 2.4s cubic-bezier(.6, 0, .3, 1) infinite; }
@keyframes turn { 0%, 22% { transform: rotate(0deg); } 50%, 78% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
#rotate .t1 { font-size: 22px; font-weight: 700; letter-spacing: 0.2em; text-indent: 0.2em; }
#rotate .t2 { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
@media (orientation: portrait) and (pointer: coarse) {
	#rotate { display: flex; }
}
/* very short landscape phones: tighten the boot column */
@media (max-height: 420px) {
	#logo { max-height: 38vh; }
	#start { height: 50px; }
	#boot.ready #start { font-size: 19px; }
	#panel { min-height: 100px; gap: 9px; }
}
</style>

<script>
// ================================================================== boot runtime (runs before index.js)
const BRAKE_BUILD_ID = '20261024053705';   // per build (gen_shell.py): beats the host's 10 min cache
function brakeFlag(name) {
	const m = new RegExp('[?&]' + name + '(?:=([^&#]*))?(?:[&#]|$)').exec(window.location.search);
	if (!m) return false;
	const v = (m[1] || '').toLowerCase();
	return !(v === '0' || v === 'false' || v === 'no' || v === 'off');
}

// ------------------------------------------------------------------ JS <-> Godot boot contract
// Godot (web only) calls, through JavaScriptBridge.eval and never blocking on it:
//   window.brakeBoot.stage(id, fraction, label)  id "scene" | "warmup", fraction 0..1 within the stage,
//                                               label = the Chinese text to show
//   window.brakeBoot.ready()                     warm-up done, the title runs smoothly behind the overlay
// and may poll window.brakeBoot.tapped (true once the player tapped "点击开始"; with ?autoplay /
// ?autostart, true once the overlay faded by itself). The boot UI script below installs the handlers;
// calls that arrive earlier are queued.
(function () {
	if (window.brakeBoot) return;
	const B = window.brakeBoot = {
		isWeb: true,
		tapped: false,
		version: 1,
		timeline: {},   // performance.now() ms of each boot step (read by tools/web/profiling)
		_queue: [],
		_handler: null,
		stage: function (id, fraction, label) {
			try {
				if (B._handler) B._handler.stage(id, fraction, label);
				else B._queue.push(['stage', id, fraction, label]);
			} catch (e) { console.warn('[boot] stage()', e); }
		},
		ready: function () {
			try {
				if (B._handler) B._handler.ready();
				else B._queue.push(['ready']);
			} catch (e) { console.warn('[boot] ready()', e); }
		},
	};
}());

// ------------------------------------------------------------------ AudioContext capture
// The engine now starts before any user gesture, so its AudioContext is created "suspended". Record
// every context the page creates; the "点击开始" handler resumes them inside the gesture.
(function () {
	const list = window.__brakeAudioContexts = window.__brakeAudioContexts || [];
	if (typeof Proxy !== 'function' || typeof Reflect !== 'object') return;
	['AudioContext', 'webkitAudioContext'].forEach(function (name) {
		const Orig = window[name];
		if (typeof Orig !== 'function') return;
		const P = new Proxy(Orig, {
			construct: function (target, args, newTarget) {
				const ctx = Reflect.construct(target, args, newTarget);
				list.push(ctx);
				return ctx;
			},
		});
		try { window[name] = P; } catch (e) { /* read-only: keep the original */ }
	});
}());

// ------------------------------------------------------------------ SCISSOR_TEST state cache
// Emscripten's offscreen-framebuffer blit (Godot asks for explicitSwapControl) calls
// gl.getParameter(SCISSOR_TEST) once per frame, a synchronous round trip to Chrome's GPU process
// (~2 ms/frame measured, docs/web_perf_research.md §2.7). Track enable/disable(SCISSOR_TEST) per
// context and answer the query from that state. The first query of a context (and the first after a
// context loss/restore) still asks the GPU, so the cache always starts from the real value.
(function () {
	const G2 = window.WebGL2RenderingContext && window.WebGL2RenderingContext.prototype;
	if (!G2 || brakeFlag('noscissorfix')) return;
	const SCISSOR_TEST = 0x0C11;
	const state = new WeakMap();
	const oEnable = G2.enable, oDisable = G2.disable, oGet = G2.getParameter, oIsEnabled = G2.isEnabled;
	G2.enable = function (cap) {
		const r = oEnable.apply(this, arguments);
		if (cap === SCISSOR_TEST) state.set(this, true);
		return r;
	};
	G2.disable = function (cap) {
		const r = oDisable.apply(this, arguments);
		if (cap === SCISSOR_TEST) state.set(this, false);
		return r;
	};
	G2.getParameter = function (pname) {
		if (pname === SCISSOR_TEST) {
			const v = state.get(this);
			if (v !== undefined) return v;
			const r = oGet.apply(this, arguments);
			if (typeof r === 'boolean') state.set(this, r);
			return r;
		}
		return oGet.apply(this, arguments);
	};
	G2.isEnabled = function (cap) {
		if (cap === SCISSOR_TEST) {
			const v = state.get(this);
			if (v !== undefined) return v;
		}
		return oIsEnabled.apply(this, arguments);
	};
	// A lost context ignores calls and a restored one is back at the defaults: forget the cached value.
	const oGetContext = HTMLCanvasElement.prototype.getContext;
	const watched = new WeakSet();
	HTMLCanvasElement.prototype.getContext = function (type) {
		const ctx = oGetContext.apply(this, arguments);
		if (ctx && type === 'webgl2' && !watched.has(this)) {
			watched.add(this);
			const forget = function () { state.delete(ctx); };
			this.addEventListener('webglcontextlost', forget, false);
			this.addEventListener('webglcontextrestored', forget, false);
		}
		return ctx;
	};
}());

// ------------------------------------------------------------------ shader precompile (during the download)
// Compiles every WebGL program the game will link (build-time capture: shaders.json.gz) in a hidden
// WebGL2 context with KHR_parallel_shader_compile, so Chrome's GPU program cache (memory + disk) already
// holds the binaries when the engine links the same programs. The cache key includes the shader
// translator's resources, i.e. the ENABLED EXTENSIONS: the hidden context must enable exactly the set the
// engine context enables (Emscripten's GL.initExtensions + Godot's OVR_multiview2), or every link misses
// (measured: docs/web_perf_research.md §2.9/§3.1 A1). Never queries status synchronously; polls
// COMPLETION_STATUS_KHR from timers so the page stays responsive.
(function () {
	const now = performance.now.bind(performance);
	const PC = window.__brakePrecompile = {
		state: 'loading',   // loading | compiling | stopping | done | timeout | skipped | error
		reason: '', total: 0, submitted: 0, done: 0, failed: 0,
		t0: now(), tList: -1, tCompile: -1, tEnd: -1, exts: null,
		ticks: 0, submitMs: 0, pollMs: 0, lat: [],   // diagnostics (tools/web/profiling)
		onchange: null, promise: null,
		giveUp: function () { stopRequested = true; if (LOWMEM && hardStop) hardStop(); },
	};
	let resolveDone;
	let stopRequested = false;
	// Android: keep the hidden context small (few programs in flight, each freed as soon as it is linked) and
	// make sure it is gone BEFORE the engine creates its own context (never two contexts alive at once).
	const LOWMEM = /Android/i.test(navigator.userAgent) || brakeFlag('lowmem');
	let hardStop = null;
	PC.promise = new Promise(function (r) { resolveDone = r; });
	// Loading-screen button: skip the precompile (remembered in localStorage, page reloads cleanly) or
	// turn it back on. ?noprecompile=1 / ?precompile=1 still work for one visit.
	const PC_OFF_KEY = 'brake.noprecompile';
	function pcOffStored() { try { return window.localStorage.getItem(PC_OFF_KEY) === '1'; } catch (e) { return false; } }
	function setSkipUI() {
		const b = document.getElementById('pcskip');
		if (!b) return;
		if (pcOffStored() && !brakeFlag('precompile')) {
			b.textContent = '预编译已关闭 · 点此重新开启';
			b.style.display = 'inline-block';
		} else if (PC.state === 'loading' || PC.state === 'compiling') {
			b.textContent = '跳过预编译（卡住或出现 context lost 时点这里）';
			b.style.display = 'inline-block';
		} else {
			b.style.display = 'none';
		}
		if (!b.__wired) {
			b.__wired = true;
			b.addEventListener('click', function () {
				try {
					if (pcOffStored()) window.localStorage.removeItem(PC_OFF_KEY);
					else window.localStorage.setItem(PC_OFF_KEY, '1');
				} catch (e) { /* storage blocked: fall back to the URL flag */ }
				const u = new URL(window.location.href);
				u.searchParams.delete('precompile');
				u.searchParams.delete('noprecompile');
				if (!pcOffStored()) {
					// storage unavailable and the user wants it off: carry the choice in the URL instead
					if (b.textContent.indexOf('跳过') === 0) u.searchParams.set('noprecompile', '1');
				}
				window.location.replace(u.toString());
			});
		}
	}
	function notify() {
		setSkipUI();
		if (PC.onchange) { try { PC.onchange(PC); } catch (e) { /* ignore */ } }
	}
	function finish(state, reason) {
		if (PC.tEnd >= 0) return;
		PC.state = state;
		if (reason) PC.reason = reason;
		PC.tEnd = now();
		if (state === 'done' || state === 'timeout') {
			console.log('[boot] shader precompile ' + state + ': ' + PC.done + '/' + PC.total + ' programs (' + PC.failed + ' failed) in ' + Math.round(PC.tEnd - PC.tCompile) + ' ms');
		} else if (reason) {
			console.log('[boot] shader precompile ' + state + ': ' + reason);
		}
		notify();
		resolveDone(PC);
	}
	if (brakeFlag('noprecompile')) { finish('skipped', '?noprecompile'); return; }
	if (pcOffStored() && !brakeFlag('precompile')) { finish('skipped', 'turned off on the loading screen'); return; }
	// Android: off by default (little gain on phone GPUs, and every Android context problem so far traced
	// back to the second context). Opt in with ?precompile=1.
	if (/Android/i.test(navigator.userAgent) && !brakeFlag('precompile')) { finish('skipped', 'android default'); return; }
	setSkipUI();
	if (typeof DecompressionStream !== 'function' || typeof ReadableStream !== 'function' || !window.WebGL2RenderingContext) {
		finish('skipped', 'unsupported browser');
		return;
	}

	const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
		(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
	const standalone = window.navigator.standalone === true ||
		(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
	if (isIOS && !standalone) boot.classList.add('ios');

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('当前浏览器缺少运行所需的功能：\n' + missing.join('\n') + '\n\n请使用最新版 Chrome / Edge / Firefox / Safari，并确认已开启硬件加速（WebGL 2）。\n\n如果刚才出现过“WebGL context lost”，浏览器会暂时禁用本站的 WebGL：请彻底关闭浏览器（从后台划掉）后重新打开。');
		return;
	}

	// ---------------------------------------------------------------- progress model
	// Stages (weights of the overall bar): download 40 || shader precompile 35 (in parallel), engine 5,
	// scene 5, warm-up 15. The status line shows the current stage (the slower of the two parallel ones).
	const LABEL = {
		download: '正在下载游戏数据',
		shaders: '正在准备图形',
		engine: '正在启动引擎',
		scene: '正在载入场景',
		warmup: '正在预热特效与声音',
		ready: '准备就绪',
	};
	const W = { download: 40, shaders: 35, engine: 5, scene: 5, warmup: 15 };
	const F = { download: 0, shaders: 0, engine: 0, scene: 0, warmup: 0 };
	const godotLabel = { scene: '', warmup: '' };
	let stage = 'download';          // download | shaders | engine | scene | warmup | ready
	let downloaded = false;
	let engineStarting = false;
	let readyAt = -1;
	let shown = 0;
	let renderQueued = false;

	function pcActive() { return PC && (PC.state === 'loading' || PC.state === 'compiling' || PC.state === 'stopping'); }
	function pcCounts() { return PC && PC.state !== 'skipped' && PC.state !== 'error'; }

	function currentStage() {
		if (readyAt >= 0) return 'ready';
		if (engineStarting) return stage === 'scene' || stage === 'warmup' ? stage : 'engine';
		const pcRunning = pcActive() && PC.state !== 'loading';
		if (!downloaded && pcRunning && F.shaders < F.download) return 'shaders';
		if (!downloaded) return 'download';
		return pcActive() ? 'shaders' : 'download';
	}

	function overall() {
		let num = 0, den = 0;
		Object.keys(W).forEach(function (k) {
			if (k === 'shaders' && !pcCounts()) return;
			num += W[k] * Math.min(1, Math.max(0, F[k]));
			den += W[k];
		});
		return den > 0 ? num / den : 0;
	}

	function render() {
		renderQueued = false;
		if (failed) return;
		const st = currentStage();
		const p = Math.max(shown, st === 'ready' ? 1 : overall());
		shown = p;
		fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
		let text;
		if (st === 'ready') {
			text = LABEL.ready;
		} else {
			const label = (st === 'scene' || st === 'warmup') && godotLabel[st] ? godotLabel[st] : LABEL[st];
			const f = st === 'shaders' ? F.shaders : F[st];
			text = st === 'engine' || !(f > 0) ? label + '…' : label + ' · ' + Math.floor(Math.min(1, f) * 100) + '%';
		}
		if (statusEl.textContent !== text) statusEl.textContent = text;
		const btn = st === 'ready' && !AUTOSTART ? '点击开始' : '加载中 · ' + Math.floor(p * 100) + '%';
		if (startLabel.textContent !== btn) startLabel.textContent = btn;
	}
	function queueRender() {
		if (renderQueued) return;
		renderQueued = true;
		requestAnimationFrame(render);
		setTimeout(function () { if (renderQueued) render(); }, 120);   // hidden tab / no rAF
	}
	// resolves after two painted frames (or 150 ms when rAF is throttled), so a new label is on screen
	// before a long blocking step starts
	function twoFrames() {
		return new Promise(function (resolve) {
			let done = false;
			const go = function () { if (!done) { done = true; resolve(); } };
			requestAnimationFrame(function () { requestAnimationFrame(go); });
			setTimeout(go, 150);
		});
	}

	if (PC) {
		PC.onchange = function () {
			if (PC.total > 0) F.shaders = (PC.done) / PC.total;
			if (PC.tEnd >= 0) TL.precompileEnd = PC.tEnd;
			queueRender();
		};
		PC.onchange(PC);
	}

	// ---------------------------------------------------------------- Godot -> shell
	B._handler = {
		stage: function (id, fraction, label) {
			if (failed) return;
			id = String(id || '');
			const f = Math.min(1, Math.max(0, Number(fraction) || 0));
			if (TL.firstStage === undefined) TL.firstStage = now();
			if (id === 'scene' || id === 'warmup') {
				F.engine = 1;
				if (id === 'warmup') F.scene = 1;
				F[id] = Math.max(F[id], f);
				if (label) godotLabel[id] = String(label).slice(0, 40);
				if (!(stage === 'warmup' && id === 'scene')) stage = id;
				if (TL['stage_' + id] === undefined) TL['stage_' + id] = now();
			}
			queueRender();
		},
		ready: function () { becomeReady(false); },
	};
	B._queue.splice(0).forEach(function (c) {
		if (c[0] === 'stage') B._handler.stage(c[1], c[2], c[3]);
		else B._handler.ready();
	});

	function becomeReady(fallback) {
		if (readyAt >= 0 || failed) return;
		readyAt = now();
		TL.ready = readyAt;
		TL.readyFallback = !!fallback;
		if (readyTimer) { clearTimeout(readyTimer); readyTimer = 0; }
		if (fallback) console.warn('[boot] the game did not call brakeBoot.ready() within ' + (READY_TIMEOUT_MS / 1000) + ' s of the engine start: enabling 点击开始 anyway');
		F.engine = F.scene = F.warmup = 1;
		try { window.localStorage.setItem('brake.loaded', '1'); } catch (e) { /* private mode */ }
		render();
		if (AUTOSTART) {
			// no tap: keep the overlay >= 300 ms and 2 painted frames after ready(), then fade it out
			Promise.all([twoFrames(), new Promise(function (r) { setTimeout(r, MIN_OVERLAY_AFTER_READY_MS); })]).then(function () {
				B.tapped = true;
				try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); }
				hideOverlay(false);
			});
			return;
		}
		boot.classList.add('ready');
		startBtn.disabled = false;
		TL.tapable = now();
		try { startBtn.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
	}

	// ---------------------------------------------------------------- tap
	function requestFullscreenLandscape() {
		if (!coarse) return false;   // desktop: stay windowed (F11 / browser controls)
		const el = document.documentElement;
		const rfs = el.requestFullscreen || el.webkitRequestFullscreen;
		if (!rfs) return false;      // iPhone Safari: no element fullscreen (use "Add to Home Screen")
		try {
			const p = rfs.call(el, { navigationUI: 'hide' });
			const lock = function () {
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function () {});
				}
			};
			if (p && p.then) p.then(lock, function () {}); else lock();
			return true;
		} catch (e) { return false; }
	}

	function resumeAudio() {
		// Godot's context (created suspended before the gesture) and any other: resume inside the gesture,
		// and start a 1-sample silent buffer on each (older iOS only unlocks on a started source).
		(window.__brakeAudioContexts || []).forEach(function (ctx) {
			try {
				if (ctx.state === 'closed') return;
				if (ctx.state !== 'running') {
					const p = ctx.resume();
					if (p && p.catch) p.catch(function () {});
				}
				const src = ctx.createBufferSource();
				src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
				src.connect(ctx.destination);
				src.start(0);
			} catch (e) { /* ignore */ }
		});
		// a throwaway context marks the page as "audio activated" on browsers that still need it
		try {
			const AC = window.AudioContext || window.webkitAudioContext;
			if (!AC) return;
			const ctx = new AC();
			const src = ctx.createBufferSource();
			src.buffer = ctx.createBuffer(1, 1, 22050);
			src.connect(ctx.destination);
			src.start(0);
			ctx.resume().then(function () { setTimeout(function () { ctx.close(); }, 200); }, function () {});
		} catch (e) { /* ignore */ }
	}

	function hideOverlay(afterFullscreen) {
		const go = function () {
			TL.leaving = now();
			boot.classList.add('leaving');
			setTimeout(function () {
				if (boot.parentNode) boot.parentNode.removeChild(boot);
				TL.hidden = now();
			}, 360);
		};
		// a phone's fullscreen switch resizes the canvas: let that frame happen under the overlay
		if (afterFullscreen) twoFrames().then(go); else go();
	}

	function tap() {
		if (B.tapped || failed || !boot.classList.contains('ready')) return;
		B.tapped = true;
		TL.tap = now();
		if (window.__brakeTilt) window.__brakeTilt.request();   // first: iOS needs the gesture
		resumeAudio();
		const fs = requestFullscreenLandscape();
		startBtn.disabled = true;
		try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); }
		hideOverlay(fs);
	}
	startBtn.addEventListener('click', tap);
	document.addEventListener('keydown', function (e) {
		if (!B.tapped && boot.classList.contains('ready') && (e.key === 'Enter' || e.key === ' ')) {
			e.preventDefault();
			tap();
		}
	});

	// ---------------------------------------------------------------- download -> precompile -> engine
	function onProgress(current, total) {
		if (current > 0 && total > 0) F.download = Math.min(1, current / total);
		queueRender();
	}

	// focusCanvas off: the canvas (and with it Godot's keyboard input) gets the focus on the tap, so
	// the Enter / Space that taps "点击开始" never reaches the game.
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, { onProgress: onProgress, focusCanvas: false }));
	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || exe + '.pck';

	function startEngine() {
		if (engineStarting || failed) return;
		engineStarting = true;
		TL.engineStart = now();
		render();
		readyTimer = setTimeout(function () { becomeReady(true); }, READY_TIMEOUT_MS);
		twoFrames().then(function () {
			return engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []) });
		}).then(function () {
			TL.engineStarted = now();
			F.engine = 1;
			queueRender();
		}, fail);
	}

	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		downloaded = true;
		F.download = 1;
		TL.downloaded = now();
		queueRender();
		if (!PC || !pcActive()) { startEngine(); return; }
		// Second visits run the precompile too: measured, Chrome's disk cache does not bring back every
		// program (starting the engine early on a "warm-looking" cache left 21 engine programs to compile).
		const wait = setTimeout(function () {
			if (pcActive()) {
				console.warn('[boot] shader precompile still running ' + (PRECOMPILE_WAIT_MS / 1000) + ' s after the download (' + PC.done + '/' + PC.total + '): starting the engine');
				PC.giveUp();
			}
			startEngine();
		}, PRECOMPILE_WAIT_MS);
		PC.promise.then(function () { clearTimeout(wait); startEngine(); });
	}, fail);

	render();
}());
</script>
</body>
</html>
